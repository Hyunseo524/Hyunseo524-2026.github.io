<!DOCTYPE html>
<html>
<head>
	<title>🐈</title>
	<link type="text/css" rel="stylesheet" href="style.css">
	<link href="https://fonts.googleapis.com/css?family=Noto+Sans|Roboto+Mono&display=swap" rel="stylesheet">
	<meta name="viewport" content="width=device-width initial-scale=1">
</head>
<body>
	<div class="container">
		<div class="intro">
			<!-- you can replace with your own profile picture -->
			<!-- or use random portrait image here: https://source.unsplash.com/100x100/?portrait -->
			<img class="profile-picture" src="images/image1.jpg" />
			<h1>☆*: .｡. o(≧▽≦)o .｡.:*☆</h1>
			<h3>Sejong University</h3>
			<p>"Let's live a short but thick life"</p>
		</div>
		<hr/>
		<div class="about-grid">
			<div class="i-am">
				<h3>I am</h3>
				<ul class="about-list">
					<li>An engineer</li>
					<li>A reader</li>
					<li>A hobby cook</li>
				</ul>
			</div>
			<div class="i-like">
				<h3>I like to</h3>
				<ul class="about-list">
					<li>sleeping</li>
					<li>animal</li>
					<li>Eat Icecream</li>
				</ul>
			</div>
		</div>

		<hr size="S" width="100%s">
		<div class="projects-heading">
			<h3>The animals I love</h3>
			<div class="projects-grid">
				<!-- you can replace with your own projects images -->
				<!-- or use random image here: https://source.unsplash.com/random/300x300/?img=1 -->
				<img class="profile-picture" src="images/cat.jpg"/>
				<img class="profile-picture" src="images/polar bear.jpg"/>
				<img class="profile-picture" src="images/Owl.jpg"/>
				<img class="profile-picture" src="images/Roe deer.jpg"/>
			</div>
		</div>
		<hr/>
		<div class="links-and-contact">
			<div class="links">
				<h3>My most frequently used links</h3>
				<ul class="links-list">
					<li>
						<a href="https://chatgpt.com/">Chatgpt</a>
					</li>
					<li>
						<a href="https://claude.ai/new">Claude</a>
					</li>
					<li>
						<a href="https://www.youtube.com/">Youtube</a>
					</li>
				</ul>
			</div>

			<div>
				<form action="#">
					<label for="email">
						Email: <input type="email" id="email" placeholder="Enter your email" /> 
					</label>
					<label for="message">
						Message: <textarea id="message">Your Message</textarea>
					</label>
					<input type="submit" class="submit-button-wrapper " valid="Send Message" />
				</form>
			</div>
		<div class="My-favorite-place">
		<h2 >My favorite place</h2>
		<div class="map">
			<iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d35758.918379459676!2d127.01913658714028!3d37.609884680987214!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x357cbb89ebee0d71%3A0x1c9ddfb894e6a046!2z67aB7ISc7Jq4IOq_iOydmOyIsg!5e0!3m2!1sko!2skr!4v1774335183783!5m2!1sko!2skr" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
		</div>
	</div>
</body>
</html>
